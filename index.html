<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="app__header">
        <div>
          <p class="eyebrow">Today</p>
          <h1 id="app-title">My Tasks</h1>
        </div>
        <span id="task-count" class="task-count">0 tasks</span>
      </header>

      <form id="task-form" class="task-form" autocomplete="off">
        <label class="sr-only" for="task-input">New task</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="What needs to be done?"
          maxlength="120"
          required
        />
        <button type="submit" aria-label="Add task">+</button>
      </form>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter is-active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="active">Active</button>
        <button class="filter" type="button" data-filter="completed">Completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state">No tasks yet. Add one above!</p>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
